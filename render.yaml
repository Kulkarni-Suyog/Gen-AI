services:
  # Public FastAPI backend. Render checks this endpoint after deployment.
  - type: web
    name: gstsaral-api
    runtime: python
    plan: free
    buildCommand: pip install -r day9/requirements.txt
    startCommand: cd day9 && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b

  # Streamlit frontend. It calls the public API service above.
  - type: web
    name: gstsaral-ui
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-ui.txt
    startCommand: streamlit run ui/app.py --server.address 0.0.0.0 --server.port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GSTSARAL_API_URL
        value: https://gstsaral-api.onrender.com
